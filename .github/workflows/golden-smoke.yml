name: Golden smoke

on:
  pull_request:
    paths:
      - 'fastpay-backend/**'
      - '.github/workflows/golden-smoke.yml'
  workflow_dispatch:

jobs:
  golden-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: fastpay-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fastpay-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # .env is gitignored; compose scripts require --env-file .env
      - name: Prepare CI env file
        run: cp .env.example .env

      - name: Generate Mongo TLS certs
        run: npm run mongo:certs

      - name: Start infrastructure
        run: npm run docker:up

      - name: Wait for Mongo
        run: npm run mongo:verify

      - name: Build services
        run: npm run build

      # Use built dist (start:prod), not start:dev — blockchain + ethers/solana
      # cold-compiles past the old 25s sleep and fails /health.
      # fraud-service is required: payment relay asserts via :3011 before queue.
      - name: Start backend services
        env:
          FASTPAY_INLINE_OFFLINE_QUEUE: 'true'
          INTERNAL_SERVICE_SECRET: ci-internal-secret
        run: |
          npm run start:prod -w @fastpay/api-gateway &
          npm run start:prod -w @fastpay/auth-service &
          npm run start:prod -w @fastpay/wallet-service &
          npm run start:prod -w @fastpay/payment-service &
          npm run start:prod -w @fastpay/blockchain-service &
          npm run start:prod -w @fastpay/fraud-service &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health >/dev/null \
              && curl -sf http://127.0.0.1:3001/health >/dev/null \
              && curl -sf http://127.0.0.1:3002/health >/dev/null \
              && curl -sf http://127.0.0.1:3003/health >/dev/null \
              && curl -sf http://127.0.0.1:3009/health >/dev/null \
              && curl -sf http://127.0.0.1:3011/health >/dev/null; then
              echo "All services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for services"
          exit 1

      - name: Run golden smoke
        env:
          GATEWAY_URL: http://127.0.0.1:3000
          INTERNAL_SERVICE_SECRET: ci-internal-secret
        run: npm run golden:smoke -- --skip-mongo

      - name: Stop Docker
        if: always()
        run: npm run docker:down
