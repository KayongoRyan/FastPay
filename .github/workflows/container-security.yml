name: Container Security

on:
  pull_request:
    paths:
      - 'fastpay-backend/**'
      - '.github/workflows/container-security.yml'
  push:
    branches: [main, master]
    paths:
      - 'fastpay-backend/**'
      - '.github/workflows/container-security.yml'

defaults:
  run:
    working-directory: fastpay-backend

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: npm run docker:build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fastpay-backend:local
          format: table
          severity: CRITICAL
          exit-code: 1

      - name: Scan base image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: node:20-alpine@sha256:b88333c42c23fbd91596ebd7fd10de239cedab9617de04142dde7315e3bc0afa
          format: table
          severity: CRITICAL
          exit-code: 1
