name: Container Security

on:
  pull_request:
    paths:
      - 'fastpay-backend/**'
      - '.github/workflows/container-security.yml'
  push:
    branches: [main, master]
    paths:
      - 'fastpay-backend/**'
      - '.github/workflows/container-security.yml'

defaults:
  run:
    working-directory: fastpay-backend

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: npm run docker:build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fastpay-backend:local
          format: table
          severity: CRITICAL
          exit-code: 1

      - name: Scan base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
          format: table
          severity: CRITICAL
          exit-code: 1
