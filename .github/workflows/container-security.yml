name: Container Security

on:
  pull_request:
    paths:
      - 'fastpay-backend/**'
      - 'FastPay/**'
      - 'fastpay-web/**'
      - '.github/workflows/container-security.yml'
      - '.gitleaks.toml'
  push:
    branches: [main, master]
    paths:
      - 'fastpay-backend/**'
      - 'FastPay/**'
      - 'fastpay-web/**'
      - '.github/workflows/container-security.yml'
      - '.gitleaks.toml'

defaults:
  run:
    working-directory: fastpay-backend

env:
  # Prefer GHCR/ECR; GCR mirror last. Avoids mid-pull flakes on a single registry.
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: npm run docker:build

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Download Trivy DB (retry)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          for i in 1 2 3; do
            echo "::group::DB download attempt $i/3"
            if trivy image --download-db-only --timeout 15m; then
              echo "DB download ok on attempt $i"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "DB download failed on attempt $i"
            sleep 20
          done
          exit 1

      - name: Run Trivy vulnerability scanner
        working-directory: ${{ github.workspace }}
        run: |
          trivy image \
            --skip-db-update \
            --severity CRITICAL \
            --exit-code 1 \
            --timeout 15m \
            --format table \
            fastpay-backend:local

      # Upstream node:22-alpine still vendors npm tar < 7.5.19 (CVE-2026-59873)
      # until Node ships npm >= 10.9.9. Our runtime image strips npm; keep base
      # scan informational so CI tracks upstream without blocking.
      - name: Scan base image (informational)
        working-directory: ${{ github.workspace }}
        run: |
          trivy image \
            --skip-db-update \
            --severity CRITICAL \
            --exit-code 0 \
            --timeout 15m \
            --format table \
            node:22-alpine

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required for gitleaks PR diff scan (parent..head); shallow clone breaks log-opts.
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [fastpay-backend, FastPay, fastpay-web]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm audit --audit-level=high
        continue-on-error: true
