apiVersion: v1
kind: Pod
metadata:
  name: mongo-debug
  namespace: fastpay
spec:
  restartPolicy: Never
  containers:
    - name: mongo-debug
      image: mongo:7
      args:
        - -c
        - |
          set -e
          docker-entrypoint.sh mongod --config /etc/mongod/mongod.conf &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "mongod still running"
            kill "$pid"
            wait "$pid" || true
          else
            echo "mongod exited early; log tail:"
            tail -80 /var/log/mongodb/mongod.log || true
            exit 1
          fi
      command: ["/bin/bash"]
      env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: fastpay-secrets
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fastpay-secrets
              key: MONGO_INITDB_ROOT_PASSWORD
      volumeMounts:
        - name: mongod-conf
          mountPath: /etc/mongod
          readOnly: true
        - name: mongo-tls
          mountPath: /etc/mongo/tls
          readOnly: true
        - name: mongo-keyfile
          mountPath: /etc/mongo/keyfile
          readOnly: true
        - name: mongo-data
          mountPath: /data/db
        - name: mongo-logs
          mountPath: /var/log/mongodb
  volumes:
    - name: mongod-conf
      configMap:
        name: mongo-config
    - name: mongo-tls
      secret:
        secretName: mongo-tls
    - name: mongo-keyfile
      secret:
        secretName: mongo-keyfile
        defaultMode: 0400
    - name: mongo-data
      emptyDir: {}
    - name: mongo-logs
      emptyDir: {}
