apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-service
  namespace: fastpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyc-service
  template:
    metadata:
      labels:
        app: kyc-service
    spec:
      initContainers:
        - name: wait-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done
      containers:
        - name: kyc-service
          image: fastpay-backend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: kyc-service
          envFrom:
            - configMapRef:
                name: fastpay-config
          ports:
            - containerPort: 3012
          readinessProbe:
            httpGet:
              path: /health
              port: 3012
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3012
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-service
  namespace: fastpay
spec:
  selector:
    app: kyc-service
  ports:
    - port: 3012
      targetPort: 3012
