apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: fastpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
        fastpay.io/mongo-client: "true"
    spec:
      initContainers:
        - name: wait-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done
      containers:
        - name: wallet-service
          image: fastpay-backend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: wallet-service
            - name: PORT
              value: "3002"
          envFrom:
            - configMapRef:
                name: fastpay-config
            - secretRef:
                name: fastpay-secrets
          ports:
            - containerPort: 3002
          volumeMounts:
            - name: mongo-tls
              mountPath: /etc/mongo-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: mongo-tls
          secret:
            secretName: mongo-tls
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: fastpay
spec:
  selector:
    app: wallet-service
  ports:
    - port: 3002
      targetPort: 3002
---
