apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fastpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        fastpay.io/mongo-client: "true"
    spec:
      initContainers:
        - name: wait-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done
        - name: wait-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo waiting for redis; sleep 2; done
      containers:
        - name: auth-service
          image: fastpay-backend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: auth-service
          envFrom:
            - configMapRef:
                name: fastpay-config
            - secretRef:
                name: fastpay-secrets
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: mongo-tls
              mountPath: /etc/mongo-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mongo-tls
          secret:
            secretName: mongo-tls
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fastpay
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
