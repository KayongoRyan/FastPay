# Copy to secrets.yaml and apply with real production values.
# Do not commit secrets.yaml with production passwords.
apiVersion: v1
kind: Secret
metadata:
  name: fastpay-secrets
  namespace: fastpay
type: Opaque
stringData:
  JWT_ACCESS_SECRET: change-me-access
  JWT_REFRESH_SECRET: change-me-refresh
  MONGO_INITDB_ROOT_USERNAME: fastpay_root
  MONGO_INITDB_ROOT_PASSWORD: change-me-root
  MONGO_APP_USER: fastpay_app
  MONGO_APP_PASSWORD: change-me-app
  MONGO_BACKUP_USER: fastpay_backup
  MONGO_BACKUP_PASSWORD: change-me-backup
  MONGO_RO_USER: fastpay_ro
  MONGO_RO_PASSWORD: change-me-ro
  MONGODB_URI: mongodb://fastpay_app:change-me-app@mongo:27017/FastPay?authSource=FastPay
