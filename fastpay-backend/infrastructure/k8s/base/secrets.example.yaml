# Copy to secrets.yaml and apply: kubectl apply -f infrastructure/k8s/base/secrets.yaml
# Do not commit secrets.yaml with real production values.
apiVersion: v1
kind: Secret
metadata:
  name: fastpay-secrets
  namespace: fastpay
type: Opaque
stringData:
  JWT_ACCESS_SECRET: change-me-access-local-k8s
  JWT_REFRESH_SECRET: change-me-refresh-local-k8s
