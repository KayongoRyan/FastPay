# Run once after deploy if the mongo PVC already existed before auth was enabled:
#   kubectl apply -f infrastructure/k8s/base/data/mongo-init-users-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init-users
  namespace: fastpay
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: mongo-init
        fastpay.io/mongo-client: "true"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-users
          image: mongo:7
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              MONGO_HOST="${MONGO_HOST:-mongo-0.mongo}"
              until mongosh --tls --tlsCAFile /etc/mongo/tls/ca.crt --tlsAllowInvalidHostnames \
                -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" \
                --authenticationDatabase admin --host "$MONGO_HOST" --eval "db.adminCommand('ping')" &>/dev/null; do
                echo "waiting for mongo..."
                sleep 3
              done
              /scripts/01-users.sh || true
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_APP_USER
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_APP_USER
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_APP_PASSWORD
            - name: MONGO_BACKUP_USER
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_BACKUP_USER
            - name: MONGO_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_BACKUP_PASSWORD
            - name: MONGO_RO_USER
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_RO_USER
            - name: MONGO_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_RO_PASSWORD
          volumeMounts:
            - name: mongo-init
              mountPath: /scripts
              readOnly: true
            - name: mongo-tls
              mountPath: /etc/mongo/tls
              readOnly: true
      volumes:
        - name: mongo-init
          configMap:
            name: mongo-init-scripts
            defaultMode: 0755
        - name: mongo-tls
          secret:
            secretName: mongo-tls
