apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
  namespace: fastpay
data:
  mongod.conf: |
    net:
      port: 27017
      bindIp: 0.0.0.0
      tls:
        mode: requireTLS
        certificateKeyFile: /etc/mongo/tls/server.pem
        CAFile: /etc/mongo/tls/ca.crt
        allowConnectionsWithoutCertificates: true
    security:
      authorization: enabled
    systemLog:
      destination: file
      path: /var/log/mongodb/mongod.log
      logAppend: true
      verbosity: 1
      component:
        accessControl:
          verbosity: 2
    storage:
      dbPath: /data/db
