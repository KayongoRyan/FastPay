apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: fastpay
spec:
  serviceName: mongo
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: mongo-keyfile-perms
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /keyfile-src/keyfile /keyfile/keyfile
              chown 999:999 /keyfile/keyfile
              chmod 400 /keyfile/keyfile
          volumeMounts:
            - name: mongo-keyfile-src
              mountPath: /keyfile-src
              readOnly: true
            - name: mongo-keyfile
              mountPath: /keyfile
      containers:
        - name: mongo
          image: mongo:7
          args: ['mongod', '--config', '/etc/mongod/mongod.conf']
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_APP_USER
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_APP_USER
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_APP_PASSWORD
            - name: MONGO_BACKUP_USER
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_BACKUP_USER
            - name: MONGO_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_BACKUP_PASSWORD
            - name: MONGO_RO_USER
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_RO_USER
            - name: MONGO_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastpay-secrets
                  key: MONGO_RO_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongod-conf
              mountPath: /etc/mongod
              readOnly: true
            - name: mongo-tls
              mountPath: /etc/mongo/tls
              readOnly: true
            - name: mongo-keyfile
              mountPath: /etc/mongo/keyfile
              readOnly: true
            - name: mongo-logs
              mountPath: /var/log/mongodb
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >
                  mongosh --tls --tlsCAFile /etc/mongo/tls/ca.crt --tlsAllowInvalidHostnames
                  -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin --eval "db.adminCommand('ping')"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 8
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >
                  mongosh --tls --tlsCAFile /etc/mongo/tls/ca.crt --tlsAllowInvalidHostnames
                  -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin --eval "db.adminCommand('ping')"
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 8
      volumes:
        - name: mongod-conf
          configMap:
            name: mongo-config
        - name: mongo-tls
          secret:
            secretName: mongo-tls
        - name: mongo-keyfile-src
          secret:
            secretName: mongo-keyfile
            defaultMode: 0400
        - name: mongo-keyfile
          emptyDir: {}
        - name: mongo-logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: fastpay
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
      name: mongo
