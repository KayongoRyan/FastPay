apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-backups
  namespace: fastpay
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  namespace: fastpay
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: mongo-backup
            fastpay.io/mongo-client: "true"
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mongodump
              image: mongo:7
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  OUT="/backups/dump-${STAMP}"
                  mongodump \
                    --host mongo \
                    --port 27017 \
                    --username "$MONGO_BACKUP_USER" \
                    --password "$MONGO_BACKUP_PASSWORD" \
                    --authenticationDatabase FastPay \
                    --db FastPay \
                    --tls \
                    --tlsCAFile /etc/mongo/tls/ca.crt \
                    --tlsAllowInvalidHostnames \
                    --out "$OUT"
                  find /backups -maxdepth 1 -type d -name 'dump-*' | sort | head -n -7 | xargs -r rm -rf
                  echo "Backup complete: $OUT"
              env:
                - name: MONGO_BACKUP_USER
                  valueFrom:
                    secretKeyRef:
                      name: fastpay-secrets
                      key: MONGO_BACKUP_USER
                - name: MONGO_BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: fastpay-secrets
                      key: MONGO_BACKUP_PASSWORD
              volumeMounts:
                - name: mongo-backups
                  mountPath: /backups
                - name: mongo-tls
                  mountPath: /etc/mongo/tls
                  readOnly: true
          volumes:
            - name: mongo-backups
              persistentVolumeClaim:
                claimName: mongo-backups
            - name: mongo-tls
              secret:
                secretName: mongo-tls
