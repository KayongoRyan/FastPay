# Network segmentation for the fastpay namespace.
#
# Model:
#   - Default: deny ALL ingress to every pod (egress stays open — services need
#     DNS, Mongo/Redis, Stellar Horizon, OpenAI, MoMo APIs).
#   - Only nginx-ingress may reach the api-gateway from outside.
#   - Pods inside the namespace may talk to each other (gateway -> services,
#     service -> service, services -> mongo/redis/rabbitmq).
#
# Net effect: nothing in the cluster is reachable from other namespaces or the
# outside world except the gateway through the ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: fastpay
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Intra-namespace traffic: any fastpay pod can reach any other fastpay pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: fastpay
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# External entry point: only the ingress-nginx controller may reach the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: fastpay
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
# Datastores: lock Mongo to fastpay pods only (belt-and-braces on top of
# default-deny; keeps the intent explicit if allow-intra-namespace changes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-from-services-only
  namespace: fastpay
spec:
  podSelector:
    matchLabels:
      app: mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-services-only
  namespace: fastpay
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-from-services-only
  namespace: fastpay
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672
