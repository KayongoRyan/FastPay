# Production secrets — copy to a sealed-secret or external secret manager.
# kubectl create secret generic fastpay-secrets --from-env-file=prod.env -n fastpay
apiVersion: v1
kind: Secret
metadata:
  name: fastpay-secrets
  namespace: fastpay
type: Opaque
stringData:
  JWT_ACCESS_SECRET: REPLACE_ME
  JWT_REFRESH_SECRET: REPLACE_ME
  MONGO_INITDB_ROOT_USERNAME: fastpay_root
  MONGO_INITDB_ROOT_PASSWORD: REPLACE_ME
  MONGO_APP_USER: fastpay_app
  MONGO_APP_PASSWORD: REPLACE_ME
  MONGO_BACKUP_USER: fastpay_backup
  MONGO_BACKUP_PASSWORD: REPLACE_ME
  MONGO_RO_USER: fastpay_ro
  MONGO_RO_PASSWORD: REPLACE_ME
  MONGODB_URI: mongodb://fastpay_app:REPLACE_ME@mongo:27017/FastPay?authSource=FastPay
