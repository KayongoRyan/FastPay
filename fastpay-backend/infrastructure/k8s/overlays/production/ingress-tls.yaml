apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: fastpay
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # TLS via cert-manager (switch to letsencrypt-prod once staging works)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Edge rate limits (first line of defense before app-level limits)
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.fastpay.rw
      secretName: api-fastpay-rw-tls
  rules:
    - host: api.fastpay.rw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
