apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fastpay

resources:
  - ../../base

secretGenerator:
  - name: mongo-tls
    files:
      - ca.crt=../../../mongo/certs/ca.crt
      - server.pem=../../../mongo/certs/server.pem
    options:
      disableNameSuffixHash: true

patches:
  - path: ingress-tls.yaml
