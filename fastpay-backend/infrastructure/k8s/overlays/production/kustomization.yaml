apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fastpay

resources:
  - ../../base

secretGenerator:
  - name: mongo-tls
    files:
      - ca.crt=certs/ca.crt
      - server.pem=certs/server.pem
    options:
      disableNameSuffixHash: true
  - name: mongo-keyfile
    files:
      - keyfile=certs/keyfile
    options:
      disableNameSuffixHash: true

patches:
  - path: ingress-tls.yaml
