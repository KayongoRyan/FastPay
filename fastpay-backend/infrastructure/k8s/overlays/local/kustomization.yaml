apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml
  - mongo-express.yaml

secretGenerator:
  - name: mongo-tls
    files:
      - ca.crt=../../../mongo/certs/ca.crt
      - server.pem=../../../mongo/certs/server.pem
    options:
      disableNameSuffixHash: true
  - name: mongo-keyfile
    files:
      - keyfile=../../../mongo/certs/keyfile
    options:
      disableNameSuffixHash: true

patches:
  - path: gateway-nodeport.yaml
  - path: image-local.yaml
