apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fastpay-staging

resources:
  - ../../base

nameSuffix: -staging

patches:
  - target:
      kind: Namespace
      name: fastpay
    patch: |
      - op: replace
        path: /metadata/name
        value: fastpay-staging

commonLabels:
  environment: staging

configMapGenerator:
  - name: fastpay-config
    behavior: merge
    literals:
      - FASTPAY_INLINE_OFFLINE_QUEUE=true
